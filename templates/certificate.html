
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Certificate</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f0f2f5;
            font-family: Georgia, serif;
        }

        .certificate {
            background: white;
            border: 12px double #c9a227;
            padding: 40px;
            text-align: center;
            max-width: 900px;
            margin: 40px auto;
            box-shadow: 0 5px 20px #bbb;
        }

        .certificate h1 {
            color: #b8860b;
            font-size: 38px;
            font-weight: bold;
        }

        .student-name {
            color: #123b75;
            font-size: 32px;
            font-weight: bold;
            border-bottom: 2px solid #c9a227;
            display: inline-block;
            padding: 5px 30px;
        }

        .course {
            font-size: 24px;
            color: #123b75;
            font-weight: bold;
        }

        @media print {
            body {
                background: white;
            }

            .certificate {
                box-shadow: none;
                margin: 0;
                max-width: none;
                min-height: 95vh;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="certificate">

        <h1>🏆 CERTIFICATE</h1>
        <h3 class="text-secondary">OF ACHIEVEMENT</h3>

        <hr>

        <p class="mt-4 fs-5">
            This certificate is proudly presented to
        </p>

        <h2 class="student-name">
            {{ student.full_name }}
        </h2>

        <p class="mt-4 fs-5">
            For completing the learning course
        </p>

        <p class="course">
            {{ course|default:"Student Learning Program" }}
        </p>

        <p class="mt-4">
            Awarded on {{ date|date:"d F Y" }}
        </p>

        <div class="row mt-5">
            <div class="col-6">
                <hr>
                <p>Student</p>
            </div>
            <div class="col-6">
                <hr>
                <p>AI Student Learning Portal</p>
            </div>
        </div>

    </div>

    <div class="text-center mb-5 no-print">
        <button class="btn btn-success btn-lg"
                onclick="window.print()">
            Download Certificate / Print
        </button>

        <a href="/dashboard/" class="btn btn-primary btn-lg">
            Dashboard
        </a>
    </div>

</div>

</body>
</html>
