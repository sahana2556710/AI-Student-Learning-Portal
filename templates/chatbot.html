<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">
            <h2>🤖 AI Student Chatbot</h2>
            <p class="mb-0">Ask questions and learn with AI</p>
        </div>

        <div class="card-body">

            <div class="alert alert-info">
                Welcome! Ask me anything related to your studies.
            </div>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Your Question</label>

                    <textarea
                        name="question"
                        class="form-control"
                        rows="4"
                        placeholder="Example: Explain DBMS normalization..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    🤖 Ask AI
                </button>

            </form>

            {% if answer %}
            <div class="mt-4">
                <h5>🤖 AI Answer</h5>

                <div class="alert alert-success">
                    {{ answer }}
                </div>
            </div>
            {% endif %}

        </div>

    </div>

    <div class="text-center mt-3">
        <a href="{% url 'student_dashboard' %}" class="btn btn-secondary">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
